<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Customer Support Chatbot Pro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

    <!-- Navbar -->

    <nav class="navbar navbar-dark bg-dark shadow">

        <div class="container">

            <span class="navbar-brand mb-0 h1">
                🤖 AI Customer Support Chatbot Pro
            </span>

        </div>

    </nav>

    <!-- Main Container -->

    <div class="container mt-5">

        <div class="row">

            <!-- Upload Section -->

            <div class="col-md-4">

                <div class="card shadow-sm">

                    <div class="card-body">

                        <h4 class="card-title mb-3">
                            📄 Upload PDF
                        </h4>

                        <form action="/upload"
                              method="POST"
                              enctype="multipart/form-data">

                            <input type="file"
                                   name="pdf"
                                   class="form-control mb-3"
                                   accept=".pdf"
                                   required>

                            <button class="btn btn-success w-100">
                                Upload PDF
                            </button>

                        </form>

                        {% if message %}

                        <div class="alert alert-success mt-3">
                            {{ message }}
                        </div>

                        {% endif %}

                    </div>

                </div>

            </div>

            <!-- Chat Section -->

            <div class="col-md-8">

                <div class="card shadow-sm">

                    <div class="card-body">

                        <h4 class="card-title mb-3">
                            💬 Ask Questions
                        </h4>

                        <form action="/ask"
                              method="POST">

                            <input type="text"
                                   name="question"
                                   class="form-control mb-3"
                                   placeholder="Ask something about your uploaded PDF..."
                                   required>

                            <button class="btn btn-primary w-100">
                                Ask AI
                            </button>

                        </form>

                        {% if question %}

                        <hr>

                        <!-- User Message -->

                        <div class="alert alert-primary">

                            <strong>👤 You:</strong>

                            <br>

                            {{ question }}

                        </div>

                        <!-- AI Response -->

                        <div class="alert alert-success">

                            <strong>🤖 AI Assistant:</strong>

                            <br><br>

                            {{ answer }}

                        </div>

                        {% endif %}

                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- Footer -->

    <footer class="text-center mt-5 mb-3 text-muted">

        Developed by <strong>Monali Singh</strong> |
        Python • Flask • Ollama • ChromaDB • RAG

    </footer>

</body>

</html>
